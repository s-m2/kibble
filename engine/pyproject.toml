[project]
name = "kibble-engine"
version = "0.0.1"
description = "Kibble engine: chunking, hybrid retrieval and freshness for codebase intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "httpx2",
  # Added when the code that uses them lands: tree-sitter (+ grammars), sqlite-vec
]

[project.scripts]
kibble-engine = "kibble_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kibble_engine"]
